<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram - Comparador de Seguidores COM CARDS</title>
    <style>
        /* TODOS OS SEUS ESTILOS ATUAIS PERMANECEM AQUI */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #fafafa;
            min-height: 100vh;
            padding: 20px;
            color: #262626;
        }

        .container {
            max-width: 935px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            padding: 0;
            box-shadow: 0 0 0 1px rgba(0,0,0,.1), 0 2px 4px rgba(0,0,0,.1);
        }

        /* ... TODOS OS OUTROS ESTILOS EXISTENTES ... */

        /* ============ NOVOS ESTILOS PARA CARDS ============ */
        
        .profile-card {
            width: 100%;
            background: white;
            border: 1px solid #dbdbdb;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.2s;
            display: none; /* Começa escondido */
        }

        .profile-card.active {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .profile-card-header {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }

        .profile-card-pic {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #e1306c;
            margin-right: 12px;
            background: #f0f0f0;
        }

        .profile-card-info {
            flex: 1;
        }

        .profile-card-name {
            font-weight: 600;
            color: #262626;
            font-size: 15px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .profile-card-username {
            color: #8e8e8e;
            font-size: 14px;
            font-weight: 400;
        }

        .profile-card-stats {
            display: flex;
            justify-content: space-around;
            text-align: center;
            border-top: 1px solid #efefef;
            padding-top: 12px;
            margin-bottom: 12px;
        }

        .profile-stat {
            flex: 1;
        }

        .profile-stat-number {
            display: block;
            font-weight: 700;
            color: #262626;
            font-size: 16px;
            margin-bottom: 2px;
        }

        .profile-stat-label {
            font-size: 11px;
            color: #8e8e8e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .profile-card-bio {
            color: #262626;
            font-size: 13px;
            line-height: 1.4;
            padding: 8px 0;
            border-top: 1px solid #efefef;
            margin-top: 8px;
            max-height: 60px;
            overflow-y: auto;
        }

        .profile-card-private {
            color: #ed4956;
            font-size: 12px;
            padding: 6px;
            background: #fef2f2;
            border-radius: 6px;
            text-align: center;
            margin-top: 8px;
            display: none;
        }

        .profile-card-verified {
            color: #0095f6;
            font-size: 14px;
        }

        .profile-card-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #8e8e8e;
        }

        .profile-card-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .profile-card-btn {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
            color: #262626;
            text-align: center;
        }

        .profile-card-btn:hover {
            background: #fafafa;
            border-color: #c7c7c7;
        }

        .profile-card-btn.primary {
            background: #0095f6;
            color: white;
            border-color: #0095f6;
        }

        .profile-card-btn.primary:hover {
            background: #0081d6;
            border-color: #0081d6;
        }

        .profile-toggle-btn {
            padding: 6px 12px;
            border: 1px solid #dbdbdb;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            background: white;
            color: #262626;
            margin-left: 10px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .profile-toggle-btn:hover {
            background: #fafafa;
            border-color: #c7c7c7;
        }

        .profile-toggle-btn.active {
            background: #0095f6;
            color: white;
            border-color: #0095f6;
        }

        .profile-toggle-btn i {
            font-size: 10px;
        }

        /* Modificações no item da lista */
        .link-container {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0; /* Permite que o flex shrink funcione */
        }

        .username-link {
            color: #0095f6;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.2s;
            padding: 4px 8px;
            border-radius: 4px;
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .username-link::before {
            content: '@';
            color: #8e8e8e;
            font-weight: 400;
        }

        .username-link:hover {
            background: rgba(0, 149, 246, 0.1);
            color: #00376b;
        }

        .username-link.visited {
            color: #40C057;
            text-decoration: line-through;
            opacity: 0.8;
        }

        /* Layout para card ao lado */
        .list-item-with-card {
            position: relative;
        }

        .card-container {
            position: absolute;
            left: 100%;
            top: 0;
            width: 320px;
            margin-left: 20px;
            z-index: 1000;
            display: none;
        }

        .card-container.active {
            display: block;
        }

        @media (max-width: 1100px) {
            .card-container {
                position: fixed;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
                width: 90%;
                max-width: 400px;
                margin-left: 0;
                z-index: 2000;
                box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            }
        }

        .card-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1999;
        }

        .card-overlay.active {
            display: block;
        }
    </style>

    <script>
        // ============ FUNÇÕES EXISTENTES (mantidas) ============
        let clickedLinks = new Set();
        
        function loadClickedLinks() {
            const saved = localStorage.getItem('instagramClickedLinks');
            if (saved) clickedLinks = new Set(JSON.parse(saved));
        }

        function saveClickedLinks() {
            localStorage.setItem('instagramClickedLinks', JSON.stringify([...clickedLinks]));
        }

        function markAsClicked(link) {
            clickedLinks.add(link);
            saveClickedLinks();
            updateLinkDisplay();
        }

        function markAsUnclicked(link) {
            clickedLinks.delete(link);
            saveClickedLinks();
            updateLinkDisplay();
        }

        function openInNewTab(url) {
            window.open(url, '_blank');
        }

        function updateLinkDisplay() {
            const links = document.querySelectorAll('#result a, .username-link');
            links.forEach(link => {
                const linkHref = link.getAttribute('data-href') || link.href;
                const listItem = link.closest('li');
                if (listItem) {
                    const indicator = listItem.querySelector('.click-indicator');
                    if (clickedLinks.has(linkHref)) {
                        link.classList.add('visited');
                        if (indicator) indicator.classList.add('visited');
                    } else {
                        link.classList.remove('visited');
                        if (indicator) indicator.classList.remove('visited');
                    }
                }
            });
            updateStats();
        }

        // ============ NOVAS FUNÇÕES PARA CARDS ============
        
        // Cache para perfis já carregados
        const profileCache = new Map();
        let activeCard = null;

        // Função para buscar dados do perfil (com cookie de sessão)
        async function fetchInstagramProfile(username) {
            // Verificar cache primeiro
            if (profileCache.has(username)) {
                return profileCache.get(username);
            }

            const loadingData = {
                username: username,
                fullName: username,
                biography: '',
                profilePicUrl: `https://ui-avatars.com/api/?name=${username}&background=random&size=150`,
                followers: 0,
                following: 0,
                posts: 0,
                isPrivate: false,
                isVerified: false,
                isLoading: true
            };

            try {
                // Usando método com cookie de sessão (você está logado)
                const response = await fetch(`https://www.instagram.com/${username}/`, {
                    credentials: 'include',
                    headers: {
                        'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
                    }
                });

                if (response.ok) {
                    const html = await response.text();
                    
                    // Extrair dados da página
                    const sharedDataMatch = html.match(/window\._sharedData\s*=\s*({.+?});<\/script>/);
                    if (sharedDataMatch) {
                        try {
                            const jsonData = JSON.parse(sharedDataMatch[1]);
                            const userData = jsonData.entry_data?.ProfilePage?.[0]?.graphql?.user;
                            
                            if (userData) {
                                const profileData = {
                                    username: userData.username || username,
                                    fullName: userData.full_name || username,
                                    biography: userData.biography || '',
                                    profilePicUrl: userData.profile_pic_url_hd || userData.profile_pic_url || loadingData.profilePicUrl,
                                    followers: userData.edge_followed_by?.count || 0,
                                    following: userData.edge_follow?.count || 0,
                                    posts: userData.edge_owner_to_timeline_media?.count || 0,
                                    isPrivate: userData.is_private || false,
                                    isVerified: userData.is_verified || false,
                                    isLoading: false
                                };
                                
                                profileCache.set(username, profileData);
                                return profileData;
                            }
                        } catch (e) {
                            console.log('Erro ao parsear JSON, usando fallback');
                        }
                    }
                }
            } catch (error) {
                console.log('Usando dados fallback para', username);
            }

            // Fallback: retornar dados básicos
            profileCache.set(username, loadingData);
            return loadingData;
        }

        // Função para criar HTML do card
        function createProfileCardHTML(profileData) {
            return `
                <div class="profile-card active">
                    <div class="profile-card-header">
                        <img src="${profileData.profilePicUrl}" 
                             class="profile-card-pic" 
                             alt="${profileData.username}"
                             onerror="this.src='https://ui-avatars.com/api/?name=${profileData.username}&background=random&size=150'">
                        <div class="profile-card-info">
                            <div class="profile-card-name">
                                ${profileData.fullName}
                                ${profileData.isVerified ? '<span class="profile-card-verified">✓</span>' : ''}
                            </div>
                            <div class="profile-card-username">@${profileData.username}</div>
                        </div>
                    </div>
                    
                    ${profileData.isPrivate ? '<div class="profile-card-private">Conta Privada</div>' : ''}
                    
                    <div class="profile-card-stats">
                        <div class="profile-stat">
                            <span class="profile-stat-number">${formatNumber(profileData.posts)}</span>
                            <span class="profile-stat-label">Posts</span>
                        </div>
                        <div class="profile-stat">
                            <span class="profile-stat-number">${formatNumber(profileData.followers)}</span>
                            <span class="profile-stat-label">Seguidores</span>
                        </div>
                        <div class="profile-stat">
                            <span class="profile-stat-number">${formatNumber(profileData.following)}</span>
                            <span class="profile-stat-label">Seguindo</span>
                        </div>
                    </div>
                    
                    ${profileData.biography ? `
                    <div class="profile-card-bio">
                        ${escapeHtml(profileData.biography)}
                    </div>
                    ` : ''}
                    
                    <div class="profile-card-actions">
                        <button class="profile-card-btn primary" onclick="window.open('https://www.instagram.com/${profileData.username}/', '_blank')">
                            <i class="fab fa-instagram"></i> Ver Perfil
                        </button>
                        <button class="profile-card-btn" onclick="hideProfileCard()">
                            <i class="fas fa-times"></i> Fechar
                        </button>
                    </div>
                </div>
            `;
        }

        // Função para mostrar card
        async function showProfileCard(username, listItem) {
            // Esconder card ativo se existir
            if (activeCard) {
                activeCard.classList.remove('active');
                document.getElementById('cardOverlay').classList.remove('active');
            }
            
            // Criar ou reutilizar container
            let cardContainer = listItem.querySelector('.card-container');
            if (!cardContainer) {
                cardContainer = document.createElement('div');
                cardContainer.className = 'card-container';
                listItem.appendChild(cardContainer);
                listItem.classList.add('list-item-with-card');
            }
            
            // Mostrar loading
            cardContainer.innerHTML = `
                <div class="profile-card active">
                    <div class="profile-card-loading">
                        <i class="fas fa-spinner fa-spin"></i> Carregando perfil...
                    </div>
                </div>
            `;
            
            cardContainer.classList.add('active');
            activeCard = cardContainer;
            
            // Ativar overlay no mobile
            document.getElementById('cardOverlay').classList.add('active');
            
            // Buscar dados
            const profileData = await fetchInstagramProfile(username);
            
            // Atualizar card com dados reais
            cardContainer.innerHTML = createProfileCardHTML(profileData);
            
            // Posicionar card
            positionCard(cardContainer, listItem);
        }

        // Função para posicionar card corretamente
        function positionCard(cardContainer, listItem) {
            const rect = listItem.getBoundingClientRect();
            const containerRect = document.querySelector('.container').getBoundingClientRect();
            
            if (window.innerWidth > 1100) {
                // Desktop: posicionar ao lado
                if (rect.right + 340 > containerRect.right) {
                    cardContainer.style.left = 'auto';
                    cardContainer.style.right = '100%';
                    cardContainer.style.marginLeft = '0';
                    cardContainer.style.marginRight = '20px';
                } else {
                    cardContainer.style.left = '100%';
                    cardContainer.style.right = 'auto';
                    cardContainer.style.marginLeft = '20px';
                    cardContainer.style.marginRight = '0';
                }
            }
        }

        // Função para esconder card
        function hideProfileCard() {
            if (activeCard) {
                activeCard.classList.remove('active');
                activeCard = null;
                document.getElementById('cardOverlay').classList.remove('active');
            }
        }

        // Função auxiliar para formatar números
        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        // Função auxiliar para escapar HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML.replace(/\n/g, '<br>');
        }

        // ============ MODIFICAÇÃO NA FUNÇÃO processListas ============
        
        // Na função processListas, MODIFICAR a criação dos itens da lista:
        // No loop onde cria cada item, adicionar o botão do card:

        function processListas() {
            // ... seu código existente até criar a lista ...
            
            const lista = document.createElement("ol");
            resultado.forEach((user, index) => {

                linkContainer.className = 'link-container';
                
                const indicator = document.createElement("span");
                indicator.className = "click-indicator";
                linkContainer.appendChild(indicator);
                
                // LINK modificado para usar nova classe
                const a = document.createElement("a");
                a.className = "username-link"; // NOVA CLASSE
                a.href = url;
                a.target = "_blank";
                a.rel = "noopener noreferrer";

                // ... seus event listeners existentes ...
                
                linkContainer.appendChild(a);
                
                // ============ BOTÃO PARA MOSTRAR CARD ============
                const cardButton = document.createElement("button");
                cardButton.className = "profile-toggle-btn";
                cardButton.innerHTML = '<i class="fas fa-id-card"></i> Card';

                linkContainer.appendChild(cardButton);

                li.appendChild(linkContainer);

                lista.appendChild(li);
            });

            // ... restante do seu código ...
        }

        // ============ EVENT LISTENERS ADICIONAIS ============
        
        // Fechar card ao clicar no overlay
        document.getElementById('cardOverlay').addEventListener('click', hideProfileCard);
        
        // Fechar card ao pressionar ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') hideProfileCard();
        });

        // Reposicionar cards ao redimensionar a janela
        window.addEventListener('resize', () => {
            if (activeCard) {
                const listItem = activeCard.closest('li');
                if (listItem) {
                    positionCard(activeCard, listItem);
                }
            }
        });

        // ============ INICIALIZAÇÃO ============
        loadClickedLinks();
        
        // Suas outras funções existentes continuam aqui...

    </script>
