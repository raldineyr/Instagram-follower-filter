<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filtro Inteligente de Perfis que NÃO te Seguem</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Poppins', sans-serif;
    background-color: #fafafa;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    margin: 0;
    padding: 40px 20px;
  }

  h1 {
    font-size: 28px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 30px;
    background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af, #515bd4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  h4 {
    text-align: center;
    color: #555;
    margin-top: -20px;
    margin-bottom: 30px;
  }

  .container {
    background: #fff;
    border: 1px solid #dbdbdb;
    border-radius: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    width: 100%;
    max-width: 700px;
    padding: 40px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    transition: box-shadow 0.3s ease;
  }

  .container:hover { box-shadow: 0 6px 18px rgba(0,0,0,0.07); }

  label { font-weight: 500; color: #262626; }

  textarea {
    width: 100%;
    height: 120px;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid #dbdbdb;
    background: #fafafa;
    font-size: 14px;
    resize: none;
    transition: all 0.25s ease;
  }

  textarea:focus {
    outline: none;
    background: #fff;
    border-color: #dd2a7b;
    box-shadow: 0 0 0 3px rgba(221,42,123,0.15);
  }

  .buttons {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 10px;
  }

  button {
    border: none;
    color: #fff;
    padding: 12px 26px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.25s ease;
  }

  #processar {
    background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af, #515bd4);
  }
  #processar:hover { opacity: 0.9; transform: scale(1.03); }

  #copyBtn { background-color: #3897f0; }
  #copyBtn:hover { background-color: #2d84d6; transform: scale(1.03); }

  #clearBtn { background-color: #ed4956; }
  #clearBtn:hover { background-color: #d73342; transform: scale(1.03); }

  #clearHistoryBtn { background-color: #8e44ad; }
  #clearHistoryBtn:hover { background-color: #7d3c98; transform: scale(1.03); }

  #output {
    text-align: center;
    color: #262626;
    font-weight: 500;
    margin-top: 10px;
  }

  #result {
    background: #fafafa;
    border-radius: 12px;
    border: 1px solid #dbdbdb;
    padding: 16px;
    font-size: 14px;
    max-height: 340px;
    overflow-y: auto;
    white-space: normal;
    word-wrap: break-word;
  }

  #result a {
    color: #0095f6;
    text-decoration: none;
    transition: color 0.2s ease;
    display: inline-flex;
    align-items: center;
    margin-right: 8px;
  }

  #result a.visited {
    color: #8e8e8e;
    text-decoration: line-through;
  }

  #result a:hover { color: #dd2a7b; }

  #result ol { margin: 0; padding-left: 20px; }

  #result li {
    margin-bottom: 8px;
    padding: 5px 0;
    display: flex;
    align-items: center;
  }

  .click-indicator {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 10px;
    background-color: #ccc;
    transition: background-color 0.3s ease;
  }

  .click-indicator.visited {
    background-color: #4CAF50;
  }

  .click-manual-btn {
    background: #4CAF50;
    color: white;
    border: none;
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 11px;
    margin-left: 8px;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .click-manual-btn:hover {
    background: #45a049;
  }

  .click-manual-btn.visited {
    background: #ff9800;
  }

  .click-manual-btn.visited:hover {
    background: #f57c00;
  }

  .stats {
    background: #f0f8ff;
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 16px;
    font-size: 14px;
    color: #333;
    border-left: 4px solid #3897f0;
  }

  footer {
    margin-top: 40px;
    text-align: center;
    color: #8e8e8e;
    font-size: 13px;
  }

  footer span {
    background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af, #515bd4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 600;
  }
</style>
</head>
<body>

<h1>🔍 Filtro Instagram</h1>
<h4>Descubra as contas que seguem o teu alvo, mas não te segue.</h4>

<div class="container">
  <label>📱 Sua lista de seguidores (quem te segue):</label>
  <textarea id="meusSeguidores" placeholder="Cole aqui os seus seguidores..."></textarea>

  <label>👥 (Opcional) Lista de pessoas que você segue:</label>
  <textarea id="meusSeguindo" placeholder="Cole aqui quem você segue... (opcional)"></textarea>

  <label>🎯 Lista de seguidores do alvo:</label>
  <textarea id="seguidoresAlvo" placeholder="Cole aqui os seguidores do seu alvo..."></textarea>

  <div class="buttons">
    <button id="processar">Filtrar</button>
    <button id="copyBtn">Copiar Resultado</button>
    <button id="clearBtn">Limpar Tudo</button>
    <button id="clearHistoryBtn">Limpar Histórico</button>
  </div>

  <p id="output"></p>
  <div id="result" style="display:none;"></div>
</div>

<footer>
  <p>Desenvolvido com ❤️ e inspiração no <span>Instagram</span></p>
</footer>

<script>
// Armazenamento local para links clicados
let clickedLinks = new Set();

// Carregar links clicados do localStorage
function loadClickedLinks() {
  const saved = localStorage.getItem('instagramClickedLinks');
  if (saved) {
    clickedLinks = new Set(JSON.parse(saved));
  }
}

// Salvar links clicados no localStorage
function saveClickedLinks() {
  localStorage.setItem('instagramClickedLinks', JSON.stringify([...clickedLinks]));
}

// Marcar um link como visitado
function markAsClicked(link) {
  clickedLinks.add(link);
  saveClickedLinks();
  updateLinkDisplay();
}

// Desmarcar um link como visitado
function markAsUnclicked(link) {
  clickedLinks.delete(link);
  saveClickedLinks();
  updateLinkDisplay();
}

// Atualizar a exibição dos links
function updateLinkDisplay() {
  const links = document.querySelectorAll('#result a');
  const manualButtons = document.querySelectorAll('.click-manual-btn');
  
  links.forEach(link => {
    const linkHref = link.href;
    const listItem = link.closest('li');
    const indicator = listItem.querySelector('.click-indicator');
    
    if (clickedLinks.has(linkHref)) {
      link.classList.add('visited');
      indicator.classList.add('visited');
    } else {
      link.classList.remove('visited');
      indicator.classList.remove('visited');
    }
  });
  
  manualButtons.forEach(button => {
    const linkHref = button.getAttribute('data-link');
    if (clickedLinks.has(linkHref)) {
      button.textContent = 'Desmarcar';
      button.classList.add('visited');
    } else {
      button.textContent = 'Marcar';
      button.classList.remove('visited');
    }
  });
  
  // Atualizar estatísticas
  updateStats();
}

// Atualizar estatísticas
function updateStats() {
  const totalLinks = document.querySelectorAll('#result a').length;
  const visitedCount = document.querySelectorAll('#result a.visited').length;
  const unvisitedCount = totalLinks - visitedCount;
  
  let statsDiv = document.querySelector('.stats');
  if (!statsDiv && totalLinks > 0) {
    statsDiv = document.createElement('div');
    statsDiv.className = 'stats';
    const resultDiv = document.getElementById('result');
    resultDiv.insertBefore(statsDiv, resultDiv.firstChild);
  }
  
  if (statsDiv && totalLinks > 0) {
    statsDiv.innerHTML = `
      <strong>Estatísticas:</strong> 
      ${visitedCount} visitados • 
      ${unvisitedCount} não visitados • 
      ${totalLinks} total
      <br><small>Clique em "Marcar" se o link foi aberto com botão do meio ou CTRL+clique</small>
    `;
  }
}

// Criar botão manual de marcação
function createManualButton(link) {
  const button = document.createElement('button');
  button.className = 'click-manual-btn';
  button.setAttribute('data-link', link);
  button.textContent = clickedLinks.has(link) ? 'Desmarcar' : 'Marcar';
  
  button.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();
    
    const linkHref = this.getAttribute('data-link');
    if (clickedLinks.has(linkHref)) {
      markAsUnclicked(linkHref);
    } else {
      markAsClicked(linkHref);
    }
  });
  
  return button;
}

// Verificar periodicamente se a aba foi aberta
function checkIfTabWasOpened(linkElement) {
  // Esta é uma solução alternativa para detectar cliques que não são capturados
  // Monitora por mudanças no foco da janela
  let originalFocus = document.hasFocus();
  
  const checkFocus = setInterval(() => {
    if (!document.hasFocus() && originalFocus) {
      // O usuário mudou para outra janela/aba - provavelmente abriu o link
      markAsClicked(linkElement.href);
      clearInterval(checkFocus);
    }
  }, 100);
  
  // Limpar após 5 segundos
  setTimeout(() => clearInterval(checkFocus), 5000);
}

// Processar os dados
document.getElementById("processar").addEventListener("click", () => {
  const meusSeguidoresText = document.getElementById("meusSeguidores").value.trim();
  const meusSeguindoText = document.getElementById("meusSeguindo").value.trim();
  const seguidoresAlvoText = document.getElementById("seguidoresAlvo").value.trim();
  const resultDiv = document.getElementById("result");
  const output = document.getElementById("output");

  if (!meusSeguidoresText || !seguidoresAlvoText) {
    alert("Por favor, cole sua lista de seguidores e a do alvo antes de continuar!");
    return;
  }

  // Lista de palavras proibidas (ignoradas automaticamente)
  const ignorar = [
    "sobre","ajuda","imprensa","api","carreiras","privacidade","termos",
    "localizações","idioma","português (brasil)","meta verified",
    "© 2025 instagram from meta","página inicial","explorar","reels","9+",
    "mensagens","notificações","foto do perfil de afroscientist","perfil",
    "meta ai","threads","mais"
  ];

  const regexID = /^[a-zA-Z0-9._@]+$/;
  const limpar = texto => texto.split(/\r?\n/)
    .map(l => l.trim().toLowerCase().replace(/^@/, ''))
    .filter(l =>
      l &&
      regexID.test(l) &&
      !ignorar.some(termo => l.includes(termo))
    );

  const meusSeguidores = new Set(limpar(meusSeguidoresText));
  const meusSeguindo = meusSeguindoText ? new Set(limpar(meusSeguindoText)) : null;
  const seguidoresAlvo = limpar(seguidoresAlvoText);

  // Filtra quem segue o alvo, mas não te segue
  let resultado = seguidoresAlvo.filter(id => !meusSeguidores.has(id));

  // Se o usuário informou quem ele segue, filtra também quem ele já segue
  if (meusSeguindo) {
    resultado = resultado.filter(id => !meusSeguindo.has(id));
  }

  if (resultado.length === 0) {
    output.textContent = "⚠️ Nenhum perfil novo encontrado — todos já te seguem ou você já os segue.";
    resultDiv.style.display = "none";
  } else {
    const mensagem = meusSeguindo
      ? `✅ ${resultado.length} perfis seguem o alvo, não te seguem e você ainda não segue.`
      : `✅ ${resultado.length} perfis seguem o alvo mas ainda não te seguem.`;
    output.textContent = mensagem;
    resultDiv.style.display = "block";

    const lista = document.createElement("ol");
    resultado.forEach(user => {
      const li = document.createElement("li");
      
      // Indicador visual de clique
      const indicator = document.createElement("span");
      indicator.className = "click-indicator";
      li.appendChild(indicator);
      
      // Link do Instagram
      const a = document.createElement("a");
      a.href = `https://www.instagram.com/${user}/`;
      a.target = "_blank"; // SEMPRE abre em nova aba
      a.textContent = `@${user}`;
      
      // Adicionar evento para capturar cliques
      a.addEventListener('click', function(e) {
        // Se for clique normal (botão esquerdo sem mods), marca imediatamente
        if (e.button === 0 && !e.ctrlKey && !e.shiftKey && !e.metaKey && !e.altKey) {
          markAsClicked(this.href);
        } else {
          // Para botão do meio ou CTRL+clique, verifica se a aba foi aberta
          checkIfTabWasOpened(this);
        }
      });
      
      // Também captura eventos de teclado (Enter no link)
      a.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          markAsClicked(this.href);
        }
      });
      
      li.appendChild(a);
      
      // Botão manual para marcar/desmarcar
      const manualBtn = createManualButton(a.href);
      li.appendChild(manualBtn);
      
      lista.appendChild(li);
    });

    resultDiv.innerHTML = "";
    resultDiv.appendChild(lista);
    
    // Carregar links já clicados e atualizar display
    loadClickedLinks();
    updateLinkDisplay();
  }
});

// Botão copiar
document.getElementById("copyBtn").addEventListener("click", () => {
  const resultLinks = document.querySelectorAll("#result a");
  if (resultLinks.length === 0) return alert("Nada para copiar!");
  const textToCopy = Array.from(resultLinks).map(a => a.href).join("\n");
  navigator.clipboard.writeText(textToCopy);
  alert("✅ Lista copiada para a área de transferência!");
});

// Botão limpar tudo
document.getElementById("clearBtn").addEventListener("click", () => {
  document.getElementById("meusSeguidores").value = "";
  document.getElementById("meusSeguindo").value = "";
  document.getElementById("seguidoresAlvo").value = "";
  document.getElementById("result").style.display = "none";
  document.getElementById("output").textContent = "";
});

// Botão limpar histórico
document.getElementById("clearHistoryBtn").addEventListener("click", () => {
  if (confirm("Tem certeza que deseja limpar o histórico de links clicados?\nIsso não afeta as listas de seguidores.")) {
    clickedLinks.clear();
    localStorage.removeItem('instagramClickedLinks');
    updateLinkDisplay();
    alert("Histórico de cliques limpo!");
  }
});

// Inicializar
loadClickedLinks();
</script>

</body>
</html>
